appId: net.nephatrine.kiwiirc
productName: KiwiIRC
asar: true
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false
directories:
  output: release
files:
  - electron/**/*
  - package.json
extraResources:
  - from: ../dist
    to: dist
  - from: assets
    to: assets
linux:
  category: Network
  desktop:
    entry:
      Name: Kiwi IRC
  executableName: kiwiirc-desktop
  icon: build/icons
  maintainer: Daniel Wolf <nephatrine@gmail.com>
  syncDesktopName: true
  target:
    - AppImage
    - deb
win:
  executableName: KiwiIRC
  icon: build/icon.ico
  target:
    - portable
appImage:
  artifactName: KiwiIRC-${version}-${arch}.${ext}
deb:
  artifactName: ${name}_${version}_${arch}.${ext}
pacman:
  artifactName: ${name}-${version}-${arch}.pkg.tar.zst
  compression: zstd
portable:
  artifactName: KiwiIRC-${version}-${arch}-portable.${ext}
