<!--
    suggest-limnoria — Limnoria command suggestions
    ------------------------------------------------
    Adds the /lim input command, local Limnoria command completion, syntax
    hints, and the per-network Limnoria settings block. Command data is loaded
    from commands.json on demand.
-->

<template id="suggest-limnoria-settings">
    <div class="kiwi-appsettings-section">
        <label class="u-checkbox-wrapper">
            <span>{{ $t('suggest-limnoria:settings_limnoria_suggestions') }} </span>
            <input v-model="suggestions" type="checkbox">
        </label>
        <label v-if="suggestions" class="kiwi-appsettings-full">
            <span>{{ $t('suggest-limnoria:settings_limnoria_name') }} </span>
            <input v-model="name" class="u-input">
        </label>
        <label v-if="suggestions" class="kiwi-appsettings-full">
            <span>{{ $t('suggest-limnoria:settings_limnoria_plugins') }} </span>
            <input
                v-model="plugins"
                class="u-input"
                :placeholder="$t('suggest-limnoria:settings_limnoria_plugins_hint')"
            >
        </label>
    </div>
</template>

<script src="suggest-limnoria.js"></script>
