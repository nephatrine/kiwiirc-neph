<!--
    Radio — bundled station player plugin
    -------------------------------------
    Adds the radio controls to the state browser, the station browser as an
    active component, station metadata polling, media-session integration, and
    the public `radio` service for other plugins.

    Settings live under plugin-radio.* and have no config-template defaults.
    Loaded by default in the bundled plugin list.
-->

<template id="kiwi-radio-controls">
    <div v-if="available" class="kiwi-radio-controls">
        <div class="kiwi-radio-controls-row">
            <a :title="$t('radio:prev')" @click="radio.skip(-1)">
                <i class="fa fa-step-backward" aria-hidden="true"></i>
            </a>
            <a
                :title="radio.ui.playing ? $t('radio:pause') : $t('radio:play')"
                @click="radio.toggle()"
            >
                <i
                    :class="radio.ui.playing ? 'fa fa-pause' : 'fa fa-play'"
                    aria-hidden="true"
                ></i>
            </a>
            <a :title="$t('radio:next')" @click="radio.skip(1)">
                <i class="fa fa-step-forward" aria-hidden="true"></i>
            </a>
            <span
                ref="nameTrack"
                class="kiwi-radio-controls-name"
                :title="radio.ui.currentName"
            >
                <span
                    ref="nameText"
                    class="kiwi-radio-controls-name-text"
                    :class="{ 'kiwi-radio-controls-name-text--scroll': nameScroll > 0 }"
                    :style="nameScrollStyle"
                >{{ radio.ui.currentName }}</span>
            </span>
            <a
                v-if="radio.ui.currentName"
                :title="radio.isStarred(radio.ui.currentName)
                    ? $t('radio:unstar')
                    : $t('radio:star')"
                @click="radio.toggleStar(radio.ui.currentName)"
            >
                <i
                    :class="radio.isStarred(radio.ui.currentName)
                        ? 'fa fa-star'
                        : 'fa fa-star-o'"
                    aria-hidden="true"
                ></i>
            </a>
            <a :title="$t('radio:stations')" @click="openList">
                <i class="fa fa-list" aria-hidden="true"></i>
            </a>
        </div>
        <div
            v-if="radio.ui.trackTitle"
            ref="trackTrack"
            class="kiwi-radio-controls-track"
            :title="radio.ui.trackTitle"
        >
            <span
                ref="trackText"
                class="kiwi-radio-controls-track-text"
                :class="{ 'kiwi-radio-controls-track-text--scroll': trackScroll > 0 }"
                :style="trackScrollStyle"
            >{{ radio.ui.trackTitle }}</span>
        </div>
        <div class="kiwi-radio-controls-row">
            <a
                :title="radio.ui.muted ? $t('radio:unmute') : $t('radio:mute')"
                @click="radio.toggleMute()"
            >
                <i
                    :class="radio.ui.muted ? 'fa fa-volume-off' : 'fa fa-volume-up'"
                    aria-hidden="true"
                ></i>
            </a>
            <input
                class="kiwi-radio-controls-volume"
                type="range"
                min="0"
                max="1"
                step="0.01"
                :value="radio.volume()"
                :aria-label="$t('radio:volume')"
                @input="onVolume"
            >
        </div>
        <canvas
            v-if="showWave"
            ref="wave"
            class="kiwi-radio-controls-wave"
            width="180"
            height="28"
            aria-hidden="true"
        ></canvas>
    </div>
</template>

<template id="kiwi-radio-browser">
    <div class="kiwi-radio-browser">
        <div class="kiwi-radio-browser-header">
            <span>{{ $t('radio:stations') }}</span>
            <a
                class="kiwi-radio-browser-close"
                :title="$t('radio:close')"
                @click.stop="close(true)"
            >
                <i class="fa fa-times" aria-hidden="true"></i>
            </a>
        </div>
        <div v-if="radio.ui.loading" class="kiwi-radio-browser-status">
            {{ $t('radio:loading') }}
        </div>
        <div v-else-if="radio.ui.error" class="kiwi-radio-browser-status">
            {{ $t('radio:' + radio.ui.error) }}
        </div>
        <div v-else-if="!radio.ui.stations.length" class="kiwi-radio-browser-status">
            {{ $t('radio:none') }}
        </div>
        <div v-else class="kiwi-radio-browser-list">
            <div
                v-for="station in ordered"
                :key="station.source"
                class="kiwi-radio-browser-station"
                :class="{ 'kiwi-radio-browser-station--active': radio.ui.currentName === station.name }"
                @click="radio.play(station)"
            >
                <img
                    v-if="station.image"
                    class="kiwi-radio-browser-image"
                    :src="station.image"
                    alt=""
                >
                <div v-else class="kiwi-radio-browser-image kiwi-radio-browser-image--empty">
                    <i class="fa fa-music" aria-hidden="true"></i>
                </div>
                <div class="kiwi-radio-browser-body">
                    <div class="kiwi-radio-browser-title">
                        <span class="kiwi-radio-browser-name">{{ station.name }}</span>
                        <a
                            class="kiwi-radio-browser-star"
                            :title="radio.isStarred(station.name)
                                ? $t('radio:unstar')
                                : $t('radio:star')"
                            @click.stop="radio.toggleStar(station.name)"
                        >
                            <i
                                :class="radio.isStarred(station.name)
                                    ? 'fa fa-star'
                                    : 'fa fa-star-o'"
                                aria-hidden="true"
                            ></i>
                        </a>
                    </div>
                    <div
                        v-if="station.description || station.channels"
                        class="kiwi-radio-browser-description"
                        @click="onDetailsClick"
                        v-html="details(station)"
                    ></div>
                    <div v-if="radio.ui.failed[station.name]" class="kiwi-radio-browser-error">
                        {{ $t('radio:error') }}
                    </div>
                </div>
            </div>
        </div>
    </div>
</template>

<script src="radio.js"></script>

<link rel="stylesheet" href="radio.css">
