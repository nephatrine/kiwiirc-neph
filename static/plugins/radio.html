<!--
    Radio — bundled station player plugin
    -------------------------------------
    Adds the radio controls to the state browser, the station browser as an
    active component, station metadata polling, media-session integration, and
    the public `radio` service for other plugins.

    Settings live under plugin-radio.* and have no config-template defaults.
    Loaded by default in the bundled plugin list.
-->

<template id="kiwi-radio-controls">
    <div v-if="available" class="kiwi-radio-controls">
        <div class="kiwi-radio-controls-row">
            <a :title="$t('radio:prev')" @click="radio.skip(-1)">
                <i class="bx bx-skip-previous" aria-hidden="true"></i>
            </a>
            <a
                :title="radio.ui.playing ? $t('radio:pause') : $t('radio:play')"
                @click="radio.toggle()"
            >
                <i
                    :class="radio.ui.playing ? 'bx bx-pause' : 'bx bx-play'"
                    aria-hidden="true"
                ></i>
            </a>
            <a :title="$t('radio:next')" @click="radio.skip(1)">
                <i class="bx bx-skip-next" aria-hidden="true"></i>
            </a>
            <span
                ref="nameTrack"
                class="kiwi-radio-controls-name"
                :title="radio.ui.currentLabel || radio.ui.currentName"
            >
                <span
                    ref="nameText"
                    class="kiwi-radio-controls-name-text"
                    :class="{ 'kiwi-radio-controls-name-text--scroll': nameScroll > 0 }"
                    :style="nameScrollStyle"
                >{{ radio.ui.currentLabel || radio.ui.currentName }}</span>
            </span>
            <a :title="$t('radio:stations')" @click="openList">
                <i class="bx bx-list-ul" aria-hidden="true"></i>
            </a>
        </div>
        <div
            v-if="radio.ui.trackTitle"
            ref="trackTrack"
            class="kiwi-radio-controls-track"
            :title="radio.ui.trackTitle"
        >
            <span
                ref="trackText"
                class="kiwi-radio-controls-track-text"
                :class="{ 'kiwi-radio-controls-track-text--scroll': trackScroll > 0 }"
                :style="trackScrollStyle"
            >{{ radio.ui.trackTitle }}</span>
        </div>
        <div class="kiwi-radio-controls-row">
            <a
                :title="radio.ui.muted ? $t('radio:unmute') : $t('radio:mute')"
                @click="radio.toggleMute()"
            >
                <i
                    :class="radio.ui.muted ? 'bx bx-volume-mute' : 'bx bx-volume-full'"
                    aria-hidden="true"
                ></i>
            </a>
            <input
                class="kiwi-radio-controls-volume"
                type="range"
                min="0"
                max="1"
                step="0.01"
                :value="radio.volume()"
                :aria-label="$t('radio:volume')"
                @input="onVolume"
            >
        </div>
        <canvas
            v-if="showWave"
            ref="wave"
            class="kiwi-radio-controls-wave"
            width="180"
            height="28"
            aria-hidden="true"
        ></canvas>
    </div>
</template>

<template id="kiwi-radio-browser">
    <div class="kiwi-radio-browser">
        <div class="kiwi-radio-browser-header">
            <span>{{ showVisualizer ? $t('radio:visualizer') : $t('radio:stations') }}</span>
            <a
                v-if="!showVisualizer"
                class="kiwi-radio-browser-add"
                :title="$t('radio:add_station')"
                @click.stop="openAddForm"
            >
                <i class="bx bx-plus" aria-hidden="true"></i>
            </a>
            <a
                v-if="!showVisualizer"
                class="kiwi-radio-browser-visualizer"
                :title="$t('radio:visualizer')"
                @click.stop="openVisualizer"
            >
                <i class="bx bx-pulse" aria-hidden="true"></i>
            </a>
            <a
                class="kiwi-radio-browser-close"
                :title="$t('radio:close')"
                @click.stop="close(true)"
            >
                <i class="bx bx-x" aria-hidden="true"></i>
            </a>
        </div>

        <radio-visualizer
            v-if="showVisualizer"
            @close="closeVisualizer"
        ></radio-visualizer>

        <template v-if="!showVisualizer">
        <form
            v-if="showForm"
            class="kiwi-radio-station-form"
            @submit.prevent="saveStation"
        >
            <div class="kiwi-radio-station-form-title">
                {{ editingSource ? $t('radio:edit_station') : $t('radio:add_station') }}
            </div>
            <label>
                <span>{{ $t('radio:station_name') }}</span>
                <input
                    v-model.trim="draft.name"
                    class="u-input"
                    type="text"
                >
            </label>
            <label>
                <span>{{ $t('radio:station_sources') }}</span>
                <textarea
                    v-model="draft.sources"
                    class="u-input"
                    rows="3"
                    required
                    @blur="autoFetchDetails"
                ></textarea>
            </label>
            <label>
                <span>{{ $t('radio:station_homepage') }}</span>
                <input
                    v-model.trim="draft.homepage"
                    class="u-input"
                    type="url"
                >
            </label>
            <label>
                <span>{{ $t('radio:station_icon') }}</span>
                <div class="kiwi-radio-station-icon-row">
                    <input
                        v-model.trim="draft.image"
                        class="u-input"
                        type="url"
                    >
                    <button
                        v-if="desktopIconsAvailable"
                        type="button"
                        class="u-button"
                        @click.prevent="chooseIcon"
                    >
                        {{ $t('radio:choose_icon') }}
                    </button>
                </div>
            </label>
            <label>
                <span>{{ $t('radio:station_description') }}</span>
                <textarea
                    v-model="draft.description"
                    class="u-input"
                    rows="2"
                ></textarea>
            </label>
            <label>
                <span>{{ $t('radio:station_now_playing') }}</span>
                <input
                    v-model.trim="draft.nowPlaying"
                    class="u-input"
                    type="url"
                >
            </label>
            <div class="kiwi-radio-station-form-actions">
                <button type="submit" class="u-button u-button-primary">
                    {{ editingSource ? $t('radio:save_station') : $t('radio:add_station') }}
                </button>
                <button
                    v-if="desktopMetadataAvailable"
                    type="button"
                    class="u-button"
                    :disabled="fetchingDetails"
                    @click.prevent="fetchDetails"
                >
                    {{ fetchingDetails
                        ? $t('radio:fetching_details')
                        : $t('radio:fetch_details') }}
                </button>
                <button type="button" class="u-button" @click="closeForm">
                    {{ $t('radio:cancel') }}
                </button>
            </div>
            <div v-if="detailStatus" class="kiwi-radio-station-form-detail">
                {{ $t('radio:' + detailStatus) }}
            </div>
            <div v-if="formError" class="kiwi-radio-station-form-error">
                {{ $t('radio:' + formError) }}
            </div>
        </form>
        <div v-if="radio.ui.loading" class="kiwi-radio-browser-status">
            {{ $t('radio:loading') }}
        </div>
        <div v-else-if="radio.ui.error" class="kiwi-radio-browser-status">
            {{ $t('radio:' + radio.ui.error) }}
        </div>
        <div v-else-if="!radio.ui.stations.length" class="kiwi-radio-browser-status">
            {{ $t('radio:none') }}
        </div>
        <div v-else class="kiwi-radio-browser-list">
            <div
                v-for="station in ordered"
                :key="station.source"
                class="kiwi-radio-browser-station"
                :class="{ 'kiwi-radio-browser-station--active': radio.ui.currentName === station.name }"
                @click="radio.play(station)"
            >
                <template v-if="showStationIcons">
                    <img
                        v-if="stationImage(station)"
                        class="kiwi-radio-browser-image"
                        :src="stationImage(station)"
                        alt=""
                    >
                    <div
                        v-else
                        class="kiwi-radio-browser-image kiwi-radio-browser-image--empty"
                    >
                        <i class="bx bx-music" aria-hidden="true"></i>
                    </div>
                </template>
                <div class="kiwi-radio-browser-body">
                    <div class="kiwi-radio-browser-title">
                        <span class="kiwi-radio-browser-name">{{ stationName(station) }}</span>
                        <a
                            class="kiwi-radio-browser-star"
                            :title="radio.isStarred(station.name)
                                ? $t('radio:unstar')
                                : $t('radio:star')"
                            @click.stop="radio.toggleStar(station.name)"
                        >
                            <i
                                :class="radio.isStarred(station.name)
                                    ? 'bx bxs-star'
                                    : 'bx bx-star'"
                                aria-hidden="true"
                            ></i>
                        </a>
                        <a
                            v-if="stationHomepage(station)"
                            class="kiwi-radio-browser-homepage"
                            :href="stationHomepage(station)"
                            :title="$t('radio:station_homepage')"
                            target="_blank"
                            rel="noopener noreferrer"
                            @click.stop
                        >
                            <i class="bx bx-link-external" aria-hidden="true"></i>
                        </a>
                        <a
                            v-if="station.custom"
                            class="kiwi-radio-browser-edit"
                            :title="$t('radio:edit_station')"
                            @click.stop="openEditForm(station)"
                        >
                            <i class="bx bx-pencil" aria-hidden="true"></i>
                        </a>
                        <a
                            class="kiwi-radio-browser-remove"
                            :title="$t('radio:remove_station')"
                            @click.stop="removeStation(station)"
                        >
                            <i class="bx bx-trash" aria-hidden="true"></i>
                        </a>
                    </div>
                    <div
                        v-if="stationDescription(station)"
                        class="kiwi-radio-browser-description"
                        @click="onDetailsClick"
                        v-html="details(station)"
                    ></div>
                    <div
                        v-if="stationInfoLine(station)"
                        class="kiwi-radio-browser-info"
                    >{{ stationInfoLine(station) }}</div>
                    <div v-if="radio.ui.failed[station.name]" class="kiwi-radio-browser-error">
                        {{ $t('radio:error') }}
                    </div>
                </div>
            </div>
        </div>
        <div
            v-if="radio.ui.hiddenStations.length"
            class="kiwi-radio-browser-hidden"
        >
            <button
                type="button"
                class="u-button"
                @click="showHidden = !showHidden"
            >
                {{ $t('radio:hidden_stations', {
                    count: radio.ui.hiddenStations.length,
                }) }}
            </button>
            <div v-if="showHidden" class="kiwi-radio-browser-hidden-list">
                <div
                    v-for="station in radio.ui.hiddenStations"
                    :key="station.source"
                    class="kiwi-radio-browser-hidden-station"
                >
                    <span>{{ stationName(station) }}</span>
                    <a @click="restoreStation(station)">
                        {{ $t('radio:restore_station') }}
                    </a>
                </div>
                <a
                    v-if="radio.ui.hiddenStations.length > 1"
                    class="kiwi-radio-browser-restore-all"
                    @click="restoreAllStations"
                >
                    {{ $t('radio:restore_all_stations') }}
                </a>
            </div>
        </div>
        </template>
    </div>
</template>

<template id="kiwi-radio-visualizer">
    <div ref="container" class="kiwi-radio-visualizer">
        <canvas ref="canvas" class="kiwi-radio-visualizer-canvas"></canvas>
        <div class="kiwi-radio-visualizer-overlay">
            <div class="kiwi-radio-visualizer-heading">
                <div class="kiwi-radio-visualizer-title">
                    {{ stationLabel || $t('radio:visualizer') }}
                </div>
                <div v-if="trackTitle" class="kiwi-radio-visualizer-track">
                    {{ trackTitle }}
                </div>
            </div>
            <div v-if="!playing" class="kiwi-radio-visualizer-notice">
                {{ $t('radio:visualizer_idle') }}
            </div>
            <div v-else-if="notice" class="kiwi-radio-visualizer-notice">
                {{ $t('radio:' + notice) }}
            </div>
            <div class="kiwi-radio-visualizer-actions">
                <a
                    :title="playing ? $t('radio:pause') : $t('radio:play')"
                    @click="radio.toggle()"
                >
                    <i
                        :class="playing ? 'bx bx-pause' : 'bx bx-play'"
                        aria-hidden="true"
                    ></i>
                </a>
                <a :title="$t('radio:prev')" @click="radio.skip(-1)">
                    <i class="bx bx-skip-previous" aria-hidden="true"></i>
                </a>
                <a :title="$t('radio:next')" @click="radio.skip(1)">
                    <i class="bx bx-skip-next" aria-hidden="true"></i>
                </a>
                <a
                    :title="$t('radio:visualizer_back')"
                    @click="$emit('close')"
                >
                    <i class="bx bx-list-ul" aria-hidden="true"></i>
                </a>
                <a
                    :title="$t('radio:' + fullscreenTitle)"
                    @click="toggleFullscreen"
                >
                    <i
                        :class="isFullscreen
                            ? 'bx bx-exit-fullscreen'
                            : 'bx bx-fullscreen'"
                        aria-hidden="true"
                    ></i>
                </a>
            </div>
        </div>
    </div>
</template>

<template id="kiwi-radio-settings">
    <div class="kiwi-appsettings-section kiwi-radio-settings">
        <label class="u-checkbox-wrapper">
            <span>{{ $t('radio:enable') }}</span>
            <input
                type="checkbox"
                :checked="enabled"
                @change="setEnabled($event.target.checked)"
            >
        </label>
        <label class="u-checkbox-wrapper">
            <span>{{ $t('radio:show_now_playing') }}</span>
            <input
                type="checkbox"
                :checked="nowPlaying"
                @change="setNowPlaying($event.target.checked)"
            >
        </label>
        <label class="u-checkbox-wrapper">
            <span>{{ $t('radio:show_station_icons') }}</span>
            <input
                type="checkbox"
                :checked="showStationIcons"
                @change="setShowStationIcons($event.target.checked)"
            >
        </label>
        <label class="u-form-block">
            <span>{{ $t('radio:show_waveform') }}</span>
            <select
                class="u-input"
                :value="waveStyle"
                @change="setWaveStyle($event.target.value)"
            >
                <option value="none">{{ $t('radio:wave_none') }}</option>
                <option value="bars">{{ $t('radio:wave_bars') }}</option>
                <option value="mirror">{{ $t('radio:wave_mirror') }}</option>
                <option value="wave">{{ $t('radio:wave_wave') }}</option>
                <option value="area">{{ $t('radio:wave_area') }}</option>
                <option value="led">{{ $t('radio:wave_led') }}</option>
                <option value="pulse">{{ $t('radio:wave_pulse') }}</option>
                <option value="peaks">{{ $t('radio:wave_peaks') }}</option>
            </select>
        </label>
    </div>
</template>

<script src="radio.js"></script>

<link rel="stylesheet" href="radio.css">
