<!--
    NephNET Cyberdeck — companion plugin
    ------------------------------------
    Adds the physical "cyberdeck" chrome around the KiwiIRC application when the
    NephDeck theme is active: top hardware bar, bottom nav-bus control strip,
    corner rivets, CRT scanlines/vignette, and the phosphor/CRT/power/audio
    controls.

    It also drives the interaction layer: a synthesized click earcon on
    button-like controls (buffers, sidebar tabs, the station manager) and
    contextual glitch bursts on highlights, link (connect/disconnect) changes
    and preset switches.

    Preset, CRT, and sound preferences persist under plugin-nephdeck.*.
    The plugin is completely inert for every other theme: it only builds the
    chrome while NephDeck is selected and removes it again when switching away.

    Loaded via the `plugins` array in config.json.
-->
<script src="nephnet-cyberdeck.js"></script>

<style>
/*
 * The cyberdeck chrome styling lives in the theme stylesheets
 * (static/themes/nephnet-cyberdeck/common.css) so it is only present while a
 * NephNET Cyberdeck theme is loaded. Nothing global is defined here.
 */
</style>
