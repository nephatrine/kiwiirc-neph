<template id="kiwi-bongo-cat">
    <div
        v-if="!store.hidden && skinReady"
        class="kiwi-bongo-cat"
        :class="{
            'kiwi-bongo-cat--asleep': asleep,
            'kiwi-bongo-cat--typing': typing,
            'kiwi-bongo-cat--open': cardOpen,
            'kiwi-bongo-cat--rested': tirednessBand === 'rested',
            'kiwi-bongo-cat--tired': tirednessBand === 'tired',
            'kiwi-bongo-cat--exhausted': tirednessBand === 'exhausted',
            'kiwi-bongo-cat--hungry': hungerBand === 'hungry',
            'kiwi-bongo-cat--starving': hungerBand === 'starving',
            'kiwi-bongo-cat--happy': moodBand === 'happy',
            'kiwi-bongo-cat--content': moodBand === 'content',
            'kiwi-bongo-cat--low-mood': moodBand === 'low',
            'kiwi-bongo-cat--grumpy': moodBand === 'grumpy',
            'kiwi-bongo-cat--evil': evilMode,
            'kiwi-bongo-cat--listening': listening,
            'kiwi-bongo-cat--acknowledge': acknowledging,
            'kiwi-bongo-cat--celebrate': celebrating,
            'kiwi-bongo-cat--worried': worried,
            'kiwi-bongo-cat--large': store.large,
            'kiwi-bongo-cat--top': store.position === 'top',
            'kiwi-bongo-cat--radio': radioMode === 'jam' || radioMode === 'tired-jam' || radioMode === 'listen',
            'kiwi-bongo-cat--radio-jam': radioMode === 'jam',
            'kiwi-bongo-cat--radio-tired': radioMode === 'tired-jam',
            'kiwi-bongo-cat--radio-listen': radioMode === 'listen',
            'kiwi-bongo-cat--toolbar-open': toolbarOpen,
        }"
    >
        <transition name="kiwi-bongo-pop">
            <div
                v-if="cardOpen"
                id="kiwi-bongo-cat-card"
                class="kiwi-bongo-cat__card"
                role="group"
                :aria-label="$t('bongo-cat:title')"
                @keydown.esc="cardOpen = false"
            >
                <div class="kiwi-bongo-cat__card-head">
                    <strong class="kiwi-bongo-cat__name">{{ store.name }}</strong>
                    <div class="kiwi-bongo-cat__card-tools">
                        <button
                            type="button"
                            class="kiwi-bongo-cat__icon-button"
                            :aria-label="$t('bongo-cat:settings')"
                            :title="$t('bongo-cat:settings')"
                            @click="openSettings"
                        >
                            <i class="fa fa-cog" aria-hidden="true"></i>
                        </button>
                        <button
                            type="button"
                            class="kiwi-bongo-cat__icon-button"
                            :aria-label="store.sound
                                ? $t('bongo-cat:mute')
                                : $t('bongo-cat:unmute')"
                            :title="store.sound
                                ? $t('bongo-cat:mute')
                                : $t('bongo-cat:unmute')"
                            @click="toggleSound"
                        >
                            <i
                                class="fa"
                                :class="store.sound ? 'fa-volume-up' : 'fa-volume-off'"
                                aria-hidden="true"
                            ></i>
                        </button>
                        <button
                            type="button"
                            class="kiwi-bongo-cat__icon-button"
                            :aria-label="store.position === 'top'
                                ? $t('bongo-cat:move_to_bottom')
                                : $t('bongo-cat:move_to_top')"
                            :title="store.position === 'top'
                                ? $t('bongo-cat:move_to_bottom')
                                : $t('bongo-cat:move_to_top')"
                            @click="togglePosition"
                        >
                            <i
                                class="fa"
                                :class="store.position === 'top' ? 'fa-arrow-down' : 'fa-arrow-up'"
                                aria-hidden="true"
                            ></i>
                        </button>
                        <button
                            type="button"
                            class="kiwi-bongo-cat__icon-button"
                            :aria-label="$t('bongo-cat:close')"
                            :title="$t('bongo-cat:close')"
                            @click="cardOpen = false"
                        >
                            <i class="fa fa-times" aria-hidden="true"></i>
                        </button>
                    </div>
                </div>
                <div class="kiwi-bongo-cat__stats">
                    <div class="kiwi-bongo-cat__stat kiwi-bongo-cat__stat--level">
                        <div class="kiwi-bongo-cat__stat-label">
                            <span>{{ $t('bongo-cat:level_label', { level: level }) }}</span>
                            <span>{{ levelPercent }}%</span>
                        </div>
                        <div
                            class="kiwi-bongo-cat__meter kiwi-bongo-cat__meter--level"
                            role="progressbar"
                            :aria-label="$t('bongo-cat:level_label', { level: level })"
                            aria-valuemin="0"
                            aria-valuemax="100"
                            :aria-valuenow="levelPercent"
                        >
                            <span :style="{ width: levelPercent + '%' }"></span>
                        </div>
                    </div>
                    <div class="kiwi-bongo-cat__stat">
                        <div class="kiwi-bongo-cat__stat-label">
                            <span>{{ $t('bongo-cat:hunger') }}</span>
                            <span>{{ Math.round(store.hunger) }}%</span>
                        </div>
                        <div
                            class="kiwi-bongo-cat__meter kiwi-bongo-cat__meter--hunger"
                            role="progressbar"
                            :aria-label="$t('bongo-cat:hunger')"
                            aria-valuemin="0"
                            aria-valuemax="100"
                            :aria-valuenow="Math.round(store.hunger)"
                        >
                            <span :style="{ width: store.hunger + '%' }"></span>
                        </div>
                    </div>
                    <div class="kiwi-bongo-cat__stat">
                        <div class="kiwi-bongo-cat__stat-label">
                            <span>{{ $t('bongo-cat:tiredness') }}</span>
                            <span>{{ Math.round(store.tiredness) }}%</span>
                        </div>
                        <div
                            class="kiwi-bongo-cat__meter kiwi-bongo-cat__meter--tiredness"
                            role="progressbar"
                            :aria-label="$t('bongo-cat:tiredness')"
                            aria-valuemin="0"
                            aria-valuemax="100"
                            :aria-valuenow="Math.round(store.tiredness)"
                        >
                            <span :style="{ width: store.tiredness + '%' }"></span>
                        </div>
                    </div>
                    <div class="kiwi-bongo-cat__stat">
                        <div class="kiwi-bongo-cat__stat-label">
                            <span>{{ $t('bongo-cat:mood') }}</span>
                            <span>{{ Math.round(store.mood) }}%</span>
                        </div>
                        <div
                            class="kiwi-bongo-cat__meter kiwi-bongo-cat__meter--mood"
                            role="progressbar"
                            :aria-label="$t('bongo-cat:mood')"
                            aria-valuemin="0"
                            aria-valuemax="100"
                            :aria-valuenow="Math.round(store.mood)"
                        >
                            <span :style="{ width: store.mood + '%' }"></span>
                        </div>
                    </div>
                </div>
                <div class="kiwi-bongo-cat__actions">
                    <button type="button" class="kiwi-bongo-cat__action" @click="pet">
                        {{ $t('bongo-cat:pet') }}
                    </button>
                    <button
                        type="button"
                        class="kiwi-bongo-cat__action"
                        :disabled="snackRemaining > 0 || store.hunger < 10"
                        :title="snackTitle"
                        @click="snack"
                    >
                        {{ $t('bongo-cat:snack') }}<span
                            v-if="snackRemaining"
                            class="kiwi-bongo-cat__cooldown"
                        >
                            {{ cooldownLabel(snackRemaining) }}
                        </span>
                    </button>
                    <button
                        type="button"
                        class="kiwi-bongo-cat__action"
                        :disabled="napRemaining > 0 || store.tiredness < 10"
                        :title="napTitle"
                        @click="nap"
                    >
                        {{ $t('bongo-cat:nap') }}<span
                            v-if="napRemaining"
                            class="kiwi-bongo-cat__cooldown"
                        >
                            {{ cooldownLabel(napRemaining) }}
                        </span>
                    </button>
                </div>
            </div>
        </transition>

        <button
            type="button"
            class="kiwi-bongo-cat__button"
            :aria-expanded="cardOpen ? 'true' : 'false'"
            aria-controls="kiwi-bongo-cat-card"
            :aria-label="$t('bongo-cat:companion_label', { name: store.name })"
            :title="store.name"
            @click="toggleCard"
        >
            <svg
                class="kiwi-bongo-cat__svg"
                viewBox="0 -15 160 170"
                aria-hidden="true"
                focusable="false"
            >
                <ellipse
                    class="kiwi-bongo-cat__shadow"
                    cx="80"
                    cy="124"
                    rx="50"
                    ry="7"
                    fill="rgba(20, 18, 16, 0.22)"
                />

                <g
                    v-if="dancing"
                    class="kiwi-bongo-cat__spotlights"
                    aria-hidden="true"
                >
                    <defs>
                        <radialGradient id="kiwi-bongo-spotlight-stage">
                            <stop offset="0" stop-color="#0b0d18" stop-opacity="0.55" />
                            <stop offset="1" stop-color="#0b0d18" stop-opacity="0" />
                        </radialGradient>
                        <radialGradient id="kiwi-bongo-spotlight-floor">
                            <stop offset="0" stop-color="#ff4fd8" stop-opacity="0.55" />
                            <stop offset="0.55" stop-color="#41e6ff" stop-opacity="0.22" />
                            <stop offset="1" stop-color="#41e6ff" stop-opacity="0" />
                        </radialGradient>
                        <linearGradient id="kiwi-bongo-spotlight-left" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0" stop-color="#41e6ff" stop-opacity="0" />
                            <stop offset="0.18" stop-color="#41e6ff" stop-opacity="0.7" />
                            <stop offset="1" stop-color="#41e6ff" stop-opacity="0" />
                        </linearGradient>
                        <linearGradient id="kiwi-bongo-spotlight-center" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0" stop-color="#ffd166" stop-opacity="0" />
                            <stop offset="0.18" stop-color="#ffd166" stop-opacity="0.6" />
                            <stop offset="1" stop-color="#ffd166" stop-opacity="0" />
                        </linearGradient>
                        <linearGradient id="kiwi-bongo-spotlight-right" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0" stop-color="#ff4fd8" stop-opacity="0" />
                            <stop offset="0.18" stop-color="#ff4fd8" stop-opacity="0.65" />
                            <stop offset="1" stop-color="#ff4fd8" stop-opacity="0" />
                        </linearGradient>
                    </defs>

                    <ellipse
                        class="kiwi-bongo-cat__spotlight-stage"
                        cx="80"
                        cy="118"
                        rx="82"
                        ry="68"
                        fill="url(#kiwi-bongo-spotlight-stage)"
                    />
                    <ellipse
                        class="kiwi-bongo-cat__spotlight-floor"
                        cx="80"
                        cy="136"
                        rx="64"
                        ry="14"
                        fill="url(#kiwi-bongo-spotlight-floor)"
                    />
                    <g class="kiwi-bongo-cat__spotlight-beams" style="mix-blend-mode: screen">
                        <polygon
                            class="kiwi-bongo-cat__spotlight-beam kiwi-bongo-cat__spotlight-beam--left"
                            points="42,-15 68,-15 108,142 24,142"
                            fill="url(#kiwi-bongo-spotlight-left)"
                        />
                        <polygon
                            class="kiwi-bongo-cat__spotlight-beam kiwi-bongo-cat__spotlight-beam--center"
                            points="72,-15 88,-15 100,142 60,142"
                            fill="url(#kiwi-bongo-spotlight-center)"
                        />
                        <polygon
                            class="kiwi-bongo-cat__spotlight-beam kiwi-bongo-cat__spotlight-beam--right"
                            points="92,-15 118,-15 136,142 52,142"
                            fill="url(#kiwi-bongo-spotlight-right)"
                        />
                    </g>
                </g>

                <g
                    v-if="evilMode"
                    class="kiwi-bongo-cat__evil-glow"
                    aria-hidden="true"
                >
                    <defs>
                        <radialGradient id="kiwi-bongo-evil-floor">
                            <stop offset="0" stop-color="#ff3b3b" stop-opacity="0.55" />
                            <stop offset="0.55" stop-color="#ff3b3b" stop-opacity="0.24" />
                            <stop offset="1" stop-color="#ff3b3b" stop-opacity="0" />
                        </radialGradient>
                    </defs>
                    <ellipse
                        cx="80"
                        cy="136"
                        rx="64"
                        ry="14"
                        fill="url(#kiwi-bongo-evil-floor)"
                    />
                </g>

                <g
                    v-if="showTail"
                    class="kiwi-bongo-cat__tail"
                    :style="{ transformOrigin: tailPivot }"
                >
                    <image
                        class="kiwi-bongo-cat__tail-layer"
                        :href="tailImage"
                        x="0"
                        y="0"
                        width="160"
                        height="155"
                    />
                </g>

                <g class="kiwi-bongo-cat__body">
                    <g v-if="showLegs" class="kiwi-bongo-cat__legs">
                        <image
                            class="kiwi-bongo-cat__legs-layer"
                            :href="legsImage"
                            x="0"
                            y="0"
                            width="160"
                            height="155"
                        />
                    </g>

                    <image
                        class="kiwi-bongo-cat__skin kiwi-bongo-cat__skin--body"
                        :href="skinBodyImage"
                        x="0"
                        y="0"
                        width="160"
                        height="155"
                    />

                    <g class="kiwi-bongo-cat__head" :style="{ transformOrigin: headPivot }">
                        <image
                            v-if="showEars && !earsInFront"
                            class="kiwi-bongo-cat__ear-layer"
                            :href="earImage"
                            x="0"
                            y="0"
                            width="160"
                            height="155"
                        />

                        <image
                            class="kiwi-bongo-cat__skin kiwi-bongo-cat__skin--head"
                            :href="skinHeadImage"
                            x="0"
                            y="0"
                            width="160"
                            height="155"
                        />

                        <g v-if="showHat" class="kiwi-bongo-cat__hat">
                            <image
                                class="kiwi-bongo-cat__hat-layer"
                                :href="hatImage"
                                x="0"
                                :y="hatY"
                                width="160"
                                height="60"
                            />
                        </g>

                        <image
                            v-if="showEars && earsInFront"
                            class="kiwi-bongo-cat__ear-layer"
                            :href="earImage"
                            x="0"
                            y="0"
                            width="160"
                            height="155"
                        />

                        <image
                            class="kiwi-bongo-cat__eye-layer"
                            :href="eyeImage"
                            x="0"
                            y="0"
                            width="160"
                            height="155"
                        />

                        <image
                            class="kiwi-bongo-cat__mouth-layer"
                            :href="mouthImage"
                            x="0"
                            y="0"
                            width="160"
                            height="155"
                        />
                    </g>
                </g>

                <image
                    class="kiwi-bongo-cat__hand kiwi-bongo-cat__hand--left"
                    :class="{ 'kiwi-bongo-cat__hand--down': leftHandDown }"
                    :style="{ transformOrigin: leftArmPivot }"
                    :href="leftHandImage"
                    x="0"
                    y="0"
                    width="160"
                    height="155"
                />

                <image
                    class="kiwi-bongo-cat__hand kiwi-bongo-cat__hand--right"
                    :class="{ 'kiwi-bongo-cat__hand--down': rightHandDown }"
                    :style="{ transformOrigin: rightArmPivot }"
                    :href="rightHandImage"
                    x="0"
                    y="0"
                    width="160"
                    height="155"
                />

                <g v-if="petted" class="kiwi-bongo-cat__heart-wrap">
                    <text x="80" y="28" text-anchor="middle" class="kiwi-bongo-cat__heart">&#9829;</text>
                </g>

                <g v-if="showMusicNotes" class="kiwi-bongo-cat__notes">
                    <text x="124" y="42">&#9834;</text>
                    <text x="136" y="26">&#9835;</text>
                    <text x="146" y="12">&#9834;</text>
                </g>

                <g v-if="asleep" class="kiwi-bongo-cat__zzz">
                    <text x="128" y="42">z</text>
                    <text x="136" y="28">z</text>
                    <text x="145" y="16">z</text>
                </g>

                <g
                    v-if="feeding && feeding.render === 'rain'"
                    class="kiwi-bongo-cat__food-rain"
                >
                    <image
                        class="kiwi-bongo-cat__food-rain-layer"
                        :href="feeding.image"
                        x="0"
                        y="0"
                        width="160"
                        height="77.5"
                    />
                </g>

                <g
                    v-if="feeding && feeding.render === 'overlay'"
                    class="kiwi-bongo-cat__snack"
                >
                    <image
                        class="kiwi-bongo-cat__snack-layer"
                        :href="feedingBitten && feeding.bittenImage
                            ? feeding.bittenImage
                            : feeding.image"
                        x="0"
                        y="0"
                        width="160"
                        height="155"
                    />
                </g>
            </svg>
        </button>
    </div>
</template>

<template id="kiwi-bongo-cat-settings">
    <div class="kiwi-bongo-settings">
        <div class="kiwi-appsettings-block">
            <h3>{{ $t('bongo-cat:title') }}</h3>
            <div class="kiwi-appsettings-section">
                <p class="kiwi-bongo-settings__hint">
                    {{ $t('bongo-cat:settings_hint') }}
                </p>
                <label class="u-form-block">
                    <span>{{ $t('bongo-cat:name') }}</span>
                    <input
                        v-model="draftName"
                        class="u-input"
                        type="text"
                        maxlength="20"
                        @keyup.enter="saveName"
                        @blur="saveName"
                    >
                </label>

                <p class="kiwi-bongo-settings__status">
                    {{ $t('bongo-cat:level_status', {
                        level: level,
                        progress: levelProgress,
                        xp: xpPerLevel,
                    }) }}<br>
                    {{ $t('bongo-cat:hunger_value', { value: Math.round(store.hunger) }) }}
                    &middot;
                    {{ $t('bongo-cat:tiredness_value', { value: Math.round(store.tiredness) }) }}
                    &middot;
                    {{ $t('bongo-cat:mood_value', { value: Math.round(store.mood) }) }}
                </p>

                <label class="u-checkbox-wrapper">
                    <span>{{ $t('bongo-cat:bongo_taps') }}</span>
                    <input type="checkbox" :checked="store.sound" @change="toggleSound">
                </label>

                <div v-if="store.sound" class="kiwi-bongo-settings__volume">
                    <input
                        v-model.number="store.volume"
                        class="kiwi-bongo-settings__range"
                        :aria-label="$t('bongo-cat:volume')"
                        type="range"
                        min="0"
                        max="1"
                        step="0.05"
                        @change="saveVolume"
                    >
                </div>

                <label class="u-checkbox-wrapper">
                    <span>{{ $t('bongo-cat:large_cat') }}</span>
                    <input type="checkbox" :checked="store.large" @change="toggleLarge">
                </label>

                <label class="u-form-block">
                    <span>{{ $t('bongo-cat:position') }}</span>
                    <select
                        class="u-input"
                        :value="store.position"
                        @change="setPosition($event.target.value)"
                    >
                        <option value="bottom">{{ $t('bongo-cat:position_bottom') }}</option>
                        <option value="top">{{ $t('bongo-cat:position_top') }}</option>
                    </select>
                </label>

                <div class="kiwi-bongo-settings__center">
                    <button
                        v-if="store.hidden"
                        type="button"
                        class="u-button u-button-primary"
                        @click="show"
                    >
                        {{ $t('bongo-cat:show_bongo_cat') }}
                    </button>
                    <button
                        v-else
                        type="button"
                        class="u-button u-button-primary"
                        @click="hide"
                    >
                        {{ $t('bongo-cat:hide_bongo_cat') }}
                    </button>
                </div>

                <p v-if="store.hidden" class="kiwi-bongo-settings__hint">
                    {{ $t('bongo-cat:hidden_care_hint', { name: store.name }) }}
                </p>
            </div>
        </div>

        <div class="kiwi-appsettings-block">
            <h3>{{ $t('bongo-cat:skin') }}</h3>
            <div class="kiwi-appsettings-section">
                <label class="u-form-block">
                    <span>{{ $t('bongo-cat:skin') }}</span>
                    <select
                        class="u-input"
                        :value="store.skin"
                        @change="selectSkin($event.target.value)"
                    >
                        <option v-for="skin in skinOptions" :key="skin" :value="skin">
                            {{ skin }}
                        </option>
                    </select>
                </label>
                <p v-if="skinError" class="kiwi-bongo-settings__error">
                    {{ $t('bongo-cat:skin_load_error', { skin: skinError }) }}
                </p>
            </div>
        </div>

        <div class="kiwi-appsettings-block">
            <h3>{{ $t('bongo-cat:cosmetics') }}</h3>
            <div class="kiwi-appsettings-section">
                <label class="u-form-block">
                    <span>{{ $t('bongo-cat:hat') }}</span>
                    <select
                        class="u-input"
                        :value="store.selectedHat"
                        @change="selectHat($event.target.value)"
                    >
                        <option value="">{{ $t('bongo-cat:hat_none') }}</option>
                        <option v-for="hat in hatOptions" :key="hat.id" :value="hat.id">
                            {{ hat.name }}
                        </option>
                    </select>
                </label>

                <div class="kiwi-bongo-settings__center">
                    <button
                        type="button"
                        class="u-button u-button-primary"
                        :disabled="hatRollsRemaining <= 0 || hatCount === 0"
                        @click="rollHat"
                    >
                        {{ $t('bongo-cat:roll_hat') }}
                    </button>
                </div>

                <p class="kiwi-bongo-settings__status">
                    {{ $t('bongo-cat:hat_rolls_remaining', { count: hatRollsRemaining }) }}
                    &middot;
                    {{ $t('bongo-cat:hat_collection', {
                        count: hatsUnlockedCount,
                        total: hatCount,
                    }) }}
                </p>

                <p v-if="hatCount === 0" class="kiwi-bongo-settings__hint">
                    {{ $t('bongo-cat:hats_unavailable') }}
                </p>

                <div
                    v-if="hatRollResult"
                    class="kiwi-bongo-settings__hat-result"
                    :class="'kiwi-bongo-settings__hat-result--' + hatRollResult.type"
                >
                    <img :src="hatRollResult.file" alt="">
                    <span v-if="hatRollResult.type === 'new'">
                        {{ $t('bongo-cat:hat_unlocked', { name: hatRollResult.name }) }}
                    </span>
                    <span v-else>
                        {{ $t('bongo-cat:hat_duplicate', { name: hatRollResult.name }) }}
                    </span>
                </div>
            </div>
        </div>

        <div class="kiwi-appsettings-block">
            <h3>{{ $t('bongo-cat:reset') }}</h3>
            <div class="kiwi-appsettings-section">
                <p class="kiwi-bongo-settings__hint">
                    {{ $t('bongo-cat:reset_hint') }}
                </p>
                <div class="kiwi-bongo-settings__center">
                    <button type="button" class="u-button u-button-warning" @click="reset">
                        {{ $t('bongo-cat:reset') }}
                    </button>
                </div>
            </div>
        </div>
    </div>
</template>

<link rel="stylesheet" href="bongo-cat.css">

<script src="bongo-cat.js"></script>
