<template id="kiwi-bongo-cat">
    <div
        v-if="!store.hidden && skinReady"
        class="kiwi-bongo-cat"
        :class="{
            'kiwi-bongo-cat--asleep': asleep,
            'kiwi-bongo-cat--typing': typing,
            'kiwi-bongo-cat--open': cardOpen,
            'kiwi-bongo-cat--rested': tirednessBand === 'rested',
            'kiwi-bongo-cat--tired': tirednessBand === 'tired',
            'kiwi-bongo-cat--exhausted': tirednessBand === 'exhausted',
            'kiwi-bongo-cat--hungry': hungerBand === 'hungry',
            'kiwi-bongo-cat--starving': hungerBand === 'starving',
            'kiwi-bongo-cat--happy': moodBand === 'happy',
            'kiwi-bongo-cat--content': moodBand === 'content',
            'kiwi-bongo-cat--low-mood': moodBand === 'low',
            'kiwi-bongo-cat--grumpy': moodBand === 'grumpy',
            'kiwi-bongo-cat--evil': evilMode,
            'kiwi-bongo-cat--listening': listening,
            'kiwi-bongo-cat--acknowledge': acknowledging,
            'kiwi-bongo-cat--celebrate': celebrating,
            'kiwi-bongo-cat--worried': worried,
            'kiwi-bongo-cat--calm': store.calm,
            'kiwi-bongo-cat--large': store.large,
            'kiwi-bongo-cat--radio': radioMode === 'jam' || radioMode === 'tired-jam' || radioMode === 'listen',
            'kiwi-bongo-cat--radio-jam': radioMode === 'jam',
            'kiwi-bongo-cat--radio-tired': radioMode === 'tired-jam',
            'kiwi-bongo-cat--radio-listen': radioMode === 'listen',
        }"
    >
        <transition name="kiwi-bongo-pop">
            <div
                v-if="cardOpen"
                id="kiwi-bongo-cat-card"
                class="kiwi-bongo-cat__card"
                role="group"
                :aria-label="$t('bongo-cat:title')"
                @keydown.esc="cardOpen = false"
            >
                <div class="kiwi-bongo-cat__card-head">
                    <strong class="kiwi-bongo-cat__name">{{ store.name }}</strong>
                    <div class="kiwi-bongo-cat__card-tools">
                        <button
                            type="button"
                            class="kiwi-bongo-cat__icon-button"
                            :aria-label="$t('bongo-cat:settings')"
                            :title="$t('bongo-cat:settings')"
                            @click="openSettings"
                        >
                            <i class="fa fa-cog" aria-hidden="true"></i>
                        </button>
                        <button
                            type="button"
                            class="kiwi-bongo-cat__icon-button"
                            :aria-label="store.sound
                                ? $t('bongo-cat:mute')
                                : $t('bongo-cat:unmute')"
                            :title="store.sound
                                ? $t('bongo-cat:mute')
                                : $t('bongo-cat:unmute')"
                            @click="toggleSound"
                        >
                            <i
                                class="fa"
                                :class="store.sound ? 'fa-volume-up' : 'fa-volume-off'"
                                aria-hidden="true"
                            ></i>
                        </button>
                        <button
                            type="button"
                            class="kiwi-bongo-cat__icon-button"
                            :aria-label="$t('bongo-cat:close')"
                            :title="$t('bongo-cat:close')"
                            @click="cardOpen = false"
                        >
                            <i class="fa fa-times" aria-hidden="true"></i>
                        </button>
                    </div>
                </div>
                <div class="kiwi-bongo-cat__stats">
                    <div class="kiwi-bongo-cat__stat kiwi-bongo-cat__stat--level">
                        <div class="kiwi-bongo-cat__stat-label">
                            <span>{{ $t('bongo-cat:level_label', { level: level }) }}</span>
                            <span>{{ levelPercent }}%</span>
                        </div>
                        <div
                            class="kiwi-bongo-cat__meter kiwi-bongo-cat__meter--level"
                            role="progressbar"
                            :aria-label="$t('bongo-cat:level_label', { level: level })"
                            aria-valuemin="0"
                            aria-valuemax="100"
                            :aria-valuenow="levelPercent"
                        >
                            <span :style="{ width: levelPercent + '%' }"></span>
                        </div>
                    </div>
                    <div class="kiwi-bongo-cat__stat">
                        <div class="kiwi-bongo-cat__stat-label">
                            <span>{{ $t('bongo-cat:hunger') }}</span>
                            <span>{{ Math.round(store.hunger) }}%</span>
                        </div>
                        <div
                            class="kiwi-bongo-cat__meter kiwi-bongo-cat__meter--hunger"
                            role="progressbar"
                            :aria-label="$t('bongo-cat:hunger')"
                            aria-valuemin="0"
                            aria-valuemax="100"
                            :aria-valuenow="Math.round(store.hunger)"
                        >
                            <span :style="{ width: store.hunger + '%' }"></span>
                        </div>
                    </div>
                    <div class="kiwi-bongo-cat__stat">
                        <div class="kiwi-bongo-cat__stat-label">
                            <span>{{ $t('bongo-cat:tiredness') }}</span>
                            <span>{{ Math.round(store.tiredness) }}%</span>
                        </div>
                        <div
                            class="kiwi-bongo-cat__meter kiwi-bongo-cat__meter--tiredness"
                            role="progressbar"
                            :aria-label="$t('bongo-cat:tiredness')"
                            aria-valuemin="0"
                            aria-valuemax="100"
                            :aria-valuenow="Math.round(store.tiredness)"
                        >
                            <span :style="{ width: store.tiredness + '%' }"></span>
                        </div>
                    </div>
                    <div class="kiwi-bongo-cat__stat">
                        <div class="kiwi-bongo-cat__stat-label">
                            <span>{{ $t('bongo-cat:mood') }}</span>
                            <span>{{ Math.round(store.mood) }}%</span>
                        </div>
                        <div
                            class="kiwi-bongo-cat__meter kiwi-bongo-cat__meter--mood"
                            role="progressbar"
                            :aria-label="$t('bongo-cat:mood')"
                            aria-valuemin="0"
                            aria-valuemax="100"
                            :aria-valuenow="Math.round(store.mood)"
                        >
                            <span :style="{ width: store.mood + '%' }"></span>
                        </div>
                    </div>
                </div>
                <div class="kiwi-bongo-cat__actions">
                    <button type="button" class="kiwi-bongo-cat__action" @click="pet">
                        {{ $t('bongo-cat:pet') }}
                    </button>
                    <button
                        type="button"
                        class="kiwi-bongo-cat__action"
                        :disabled="snackRemaining > 0 || store.hunger < 10"
                        :title="snackTitle"
                        @click="snack"
                    >
                        {{ $t('bongo-cat:snack') }}<span
                            v-if="snackRemaining"
                            class="kiwi-bongo-cat__cooldown"
                        >
                            {{ cooldownLabel(snackRemaining) }}
                        </span>
                    </button>
                    <button
                        type="button"
                        class="kiwi-bongo-cat__action"
                        :disabled="napRemaining > 0 || store.tiredness < 10"
                        :title="napTitle"
                        @click="nap"
                    >
                        {{ $t('bongo-cat:nap') }}<span
                            v-if="napRemaining"
                            class="kiwi-bongo-cat__cooldown"
                        >
                            {{ cooldownLabel(napRemaining) }}
                        </span>
                    </button>
                </div>
            </div>
        </transition>

        <button
            type="button"
            class="kiwi-bongo-cat__button"
            :aria-expanded="cardOpen ? 'true' : 'false'"
            aria-controls="kiwi-bongo-cat-card"
            :aria-label="$t('bongo-cat:companion_label', { name: store.name })"
            :title="store.name"
            @click="toggleCard"
        >
            <svg
                class="kiwi-bongo-cat__svg"
                viewBox="0 -15 160 170"
                aria-hidden="true"
                focusable="false"
            >
                <ellipse
                    class="kiwi-bongo-cat__shadow"
                    cx="80"
                    cy="124"
                    rx="50"
                    ry="7"
                    fill="rgba(20, 18, 16, 0.22)"
                />

                <g
                    v-if="dancing && !store.calm"
                    class="kiwi-bongo-cat__spotlights"
                    aria-hidden="true"
                >
                    <defs>
                        <radialGradient id="kiwi-bongo-spotlight-stage">
                            <stop offset="0" stop-color="#0b0d18" stop-opacity="0.55" />
                            <stop offset="1" stop-color="#0b0d18" stop-opacity="0" />
                        </radialGradient>
                        <radialGradient id="kiwi-bongo-spotlight-floor">
                            <stop offset="0" stop-color="#ff4fd8" stop-opacity="0.55" />
                            <stop offset="0.55" stop-color="#41e6ff" stop-opacity="0.22" />
                            <stop offset="1" stop-color="#41e6ff" stop-opacity="0" />
                        </radialGradient>
                        <linearGradient id="kiwi-bongo-spotlight-left" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0" stop-color="#41e6ff" stop-opacity="0" />
                            <stop offset="0.18" stop-color="#41e6ff" stop-opacity="0.7" />
                            <stop offset="1" stop-color="#41e6ff" stop-opacity="0" />
                        </linearGradient>
                        <linearGradient id="kiwi-bongo-spotlight-center" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0" stop-color="#ffd166" stop-opacity="0" />
                            <stop offset="0.18" stop-color="#ffd166" stop-opacity="0.6" />
                            <stop offset="1" stop-color="#ffd166" stop-opacity="0" />
                        </linearGradient>
                        <linearGradient id="kiwi-bongo-spotlight-right" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0" stop-color="#ff4fd8" stop-opacity="0" />
                            <stop offset="0.18" stop-color="#ff4fd8" stop-opacity="0.65" />
                            <stop offset="1" stop-color="#ff4fd8" stop-opacity="0" />
                        </linearGradient>
                    </defs>

                    <ellipse
                        class="kiwi-bongo-cat__spotlight-stage"
                        cx="80"
                        cy="118"
                        rx="82"
                        ry="68"
                        fill="url(#kiwi-bongo-spotlight-stage)"
                    />
                    <ellipse
                        class="kiwi-bongo-cat__spotlight-floor"
                        cx="80"
                        cy="136"
                        rx="64"
                        ry="14"
                        fill="url(#kiwi-bongo-spotlight-floor)"
                    />
                    <g class="kiwi-bongo-cat__spotlight-beams" style="mix-blend-mode: screen">
                        <polygon
                            class="kiwi-bongo-cat__spotlight-beam kiwi-bongo-cat__spotlight-beam--left"
                            points="42,-15 68,-15 108,142 24,142"
                            fill="url(#kiwi-bongo-spotlight-left)"
                        />
                        <polygon
                            class="kiwi-bongo-cat__spotlight-beam kiwi-bongo-cat__spotlight-beam--center"
                            points="72,-15 88,-15 100,142 60,142"
                            fill="url(#kiwi-bongo-spotlight-center)"
                        />
                        <polygon
                            class="kiwi-bongo-cat__spotlight-beam kiwi-bongo-cat__spotlight-beam--right"
                            points="92,-15 118,-15 136,142 52,142"
                            fill="url(#kiwi-bongo-spotlight-right)"
                        />
                    </g>
                </g>

                <g
                    v-if="evilMode"
                    class="kiwi-bongo-cat__evil-glow"
                    aria-hidden="true"
                >
                    <defs>
                        <radialGradient id="kiwi-bongo-evil-floor">
                            <stop offset="0" stop-color="#ff3b3b" stop-opacity="0.55" />
                            <stop offset="0.55" stop-color="#ff3b3b" stop-opacity="0.24" />
                            <stop offset="1" stop-color="#ff3b3b" stop-opacity="0" />
                        </radialGradient>
                    </defs>
                    <ellipse
                        cx="80"
                        cy="136"
                        rx="64"
                        ry="14"
                        fill="url(#kiwi-bongo-evil-floor)"
                    />
                </g>

                <g
                    v-if="showTail"
                    class="kiwi-bongo-cat__tail"
                    :style="{ transformOrigin: tailPivot }"
                >
                    <image
                        class="kiwi-bongo-cat__tail-layer"
                        :href="tailImage"
                        x="0"
                        y="0"
                        width="160"
                        height="155"
                    />
                </g>

                <g class="kiwi-bongo-cat__body">
                    <g v-if="showLegs" class="kiwi-bongo-cat__legs">
                        <image
                            class="kiwi-bongo-cat__legs-layer"
                            :href="legsImage"
                            x="0"
                            y="0"
                            width="160"
                            height="155"
                        />
                    </g>

                    <image
                        class="kiwi-bongo-cat__skin kiwi-bongo-cat__skin--body"
                        :href="skinBodyImage"
                        x="0"
                        y="0"
                        width="160"
                        height="155"
                    />

                    <g class="kiwi-bongo-cat__head" :style="{ transformOrigin: headPivot }">
                        <image
                            v-if="showEars && !earsInFront"
                            class="kiwi-bongo-cat__ear-layer"
                            :href="earImage"
                            x="0"
                            y="0"
                            width="160"
                            height="155"
                        />

                        <image
                            class="kiwi-bongo-cat__skin kiwi-bongo-cat__skin--head"
                            :href="skinHeadImage"
                            x="0"
                            y="0"
                            width="160"
                            height="155"
                        />

                        <g v-if="showHat" class="kiwi-bongo-cat__hat">
                            <image
                                class="kiwi-bongo-cat__hat-layer"
                                :href="hatImage"
                                x="0"
                                :y="hatY"
                                width="160"
                                height="60"
                            />
                        </g>

                        <image
                            v-if="showEars && earsInFront"
                            class="kiwi-bongo-cat__ear-layer"
                            :href="earImage"
                            x="0"
                            y="0"
                            width="160"
                            height="155"
                        />

                        <image
                            class="kiwi-bongo-cat__eye-layer"
                            :href="eyeImage"
                            x="0"
                            y="0"
                            width="160"
                            height="155"
                        />

                        <image
                            class="kiwi-bongo-cat__mouth-layer"
                            :href="mouthImage"
                            x="0"
                            y="0"
                            width="160"
                            height="155"
                        />
                    </g>
                </g>

                <image
                    class="kiwi-bongo-cat__hand kiwi-bongo-cat__hand--left"
                    :class="{ 'kiwi-bongo-cat__hand--down': leftHandDown }"
                    :style="{ transformOrigin: leftArmPivot }"
                    :href="leftHandImage"
                    x="0"
                    y="0"
                    width="160"
                    height="155"
                />

                <image
                    class="kiwi-bongo-cat__hand kiwi-bongo-cat__hand--right"
                    :class="{ 'kiwi-bongo-cat__hand--down': rightHandDown }"
                    :style="{ transformOrigin: rightArmPivot }"
                    :href="rightHandImage"
                    x="0"
                    y="0"
                    width="160"
                    height="155"
                />

                <g v-if="petted" class="kiwi-bongo-cat__heart-wrap">
                    <text x="80" y="28" text-anchor="middle" class="kiwi-bongo-cat__heart">&#9829;</text>
                </g>

                <g v-if="showMusicNotes" class="kiwi-bongo-cat__notes">
                    <text x="124" y="42">&#9834;</text>
                    <text x="136" y="26">&#9835;</text>
                    <text x="146" y="12">&#9834;</text>
                </g>

                <g v-if="asleep" class="kiwi-bongo-cat__zzz">
                    <text x="128" y="42">z</text>
                    <text x="136" y="28">z</text>
                    <text x="145" y="16">z</text>
                </g>

                <g
                    v-if="feeding && feeding.render === 'rain'"
                    class="kiwi-bongo-cat__food-rain"
                >
                    <image
                        class="kiwi-bongo-cat__food-rain-layer"
                        :href="feeding.image"
                        x="0"
                        y="0"
                        width="160"
                        height="77.5"
                    />
                </g>

                <g
                    v-if="feeding && feeding.render === 'overlay'"
                    class="kiwi-bongo-cat__snack"
                >
                    <image
                        class="kiwi-bongo-cat__snack-layer"
                        :href="feedingBitten && feeding.bittenImage
                            ? feeding.bittenImage
                            : feeding.image"
                        x="0"
                        y="0"
                        width="160"
                        height="155"
                    />
                </g>
            </svg>
        </button>
    </div>
</template>

<template id="kiwi-bongo-cat-settings">
    <div class="kiwi-bongo-settings">
        <div class="kiwi-appsettings-block">
            <h3>{{ $t('bongo-cat:title') }}</h3>
            <div class="kiwi-appsettings-section">
                <p class="kiwi-bongo-settings__hint">
                    {{ $t('bongo-cat:settings_hint') }}
                </p>
                <label class="u-form-block">
                    <span>{{ $t('bongo-cat:name') }}</span>
                    <input
                        v-model="draftName"
                        class="u-input"
                        type="text"
                        maxlength="20"
                        @keyup.enter="saveName"
                        @blur="saveName"
                    >
                </label>

                <p class="kiwi-bongo-settings__status">
                    {{ $t('bongo-cat:level_status', {
                        level: level,
                        progress: levelProgress,
                        xp: xpPerLevel,
                    }) }}<br>
                    {{ $t('bongo-cat:hunger_value', { value: Math.round(store.hunger) }) }}
                    &middot;
                    {{ $t('bongo-cat:tiredness_value', { value: Math.round(store.tiredness) }) }}
                    &middot;
                    {{ $t('bongo-cat:mood_value', { value: Math.round(store.mood) }) }}
                </p>

                <label class="u-checkbox-wrapper">
                    <span>{{ $t('bongo-cat:bongo_taps') }}</span>
                    <input type="checkbox" :checked="store.sound" @change="toggleSound">
                </label>

                <div v-if="store.sound" class="kiwi-bongo-settings__volume">
                    <input
                        v-model.number="store.volume"
                        class="kiwi-bongo-settings__range"
                        :aria-label="$t('bongo-cat:volume')"
                        type="range"
                        min="0"
                        max="1"
                        step="0.05"
                        @change="saveVolume"
                    >
                </div>

                <label class="u-checkbox-wrapper">
                    <span>{{ $t('bongo-cat:calm') }}</span>
                    <input type="checkbox" :checked="store.calm" @change="toggleCalm">
                </label>

                <label class="u-checkbox-wrapper">
                    <span>{{ $t('bongo-cat:large_cat') }}</span>
                    <input type="checkbox" :checked="store.large" @change="toggleLarge">
                </label>

                <div class="kiwi-bongo-settings__center">
                    <button
                        v-if="store.hidden"
                        type="button"
                        class="u-button u-button-primary"
                        @click="show"
                    >
                        {{ $t('bongo-cat:show_bongo_cat') }}
                    </button>
                    <button
                        v-else
                        type="button"
                        class="u-button u-button-primary"
                        @click="hide"
                    >
                        {{ $t('bongo-cat:hide_bongo_cat') }}
                    </button>
                </div>

                <p v-if="store.hidden" class="kiwi-bongo-settings__hint">
                    {{ $t('bongo-cat:hidden_care_hint', { name: store.name }) }}
                </p>
            </div>
        </div>

        <div class="kiwi-appsettings-block">
            <h3>{{ $t('bongo-cat:skin') }}</h3>
            <div class="kiwi-appsettings-section">
                <label class="u-form-block">
                    <span>{{ $t('bongo-cat:skin') }}</span>
                    <select
                        class="u-input"
                        :value="store.skin"
                        @change="selectSkin($event.target.value)"
                    >
                        <option v-for="skin in skinOptions" :key="skin" :value="skin">
                            {{ skin }}
                        </option>
                    </select>
                </label>
                <p v-if="skinError" class="kiwi-bongo-settings__error">
                    {{ $t('bongo-cat:skin_load_error', { skin: skinError }) }}
                </p>
            </div>
        </div>

        <div class="kiwi-appsettings-block">
            <h3>{{ $t('bongo-cat:cosmetics') }}</h3>
            <div class="kiwi-appsettings-section">
                <label class="u-form-block">
                    <span>{{ $t('bongo-cat:hat') }}</span>
                    <select
                        class="u-input"
                        :value="store.selectedHat"
                        @change="selectHat($event.target.value)"
                    >
                        <option value="">{{ $t('bongo-cat:hat_none') }}</option>
                        <option v-for="hat in hatOptions" :key="hat.id" :value="hat.id">
                            {{ hat.name }}
                        </option>
                    </select>
                </label>

                <div class="kiwi-bongo-settings__center">
                    <button
                        type="button"
                        class="u-button u-button-primary"
                        :disabled="hatRollsRemaining <= 0 || hatCount === 0"
                        @click="rollHat"
                    >
                        {{ $t('bongo-cat:roll_hat') }}
                    </button>
                </div>

                <p class="kiwi-bongo-settings__status">
                    {{ $t('bongo-cat:hat_rolls_remaining', { count: hatRollsRemaining }) }}
                    &middot;
                    {{ $t('bongo-cat:hat_collection', {
                        count: hatsUnlockedCount,
                        total: hatCount,
                    }) }}
                </p>

                <p v-if="hatCount === 0" class="kiwi-bongo-settings__hint">
                    {{ $t('bongo-cat:hats_unavailable') }}
                </p>

                <div
                    v-if="hatRollResult"
                    class="kiwi-bongo-settings__hat-result"
                    :class="'kiwi-bongo-settings__hat-result--' + hatRollResult.type"
                >
                    <img :src="hatRollResult.file" alt="">
                    <span v-if="hatRollResult.type === 'new'">
                        {{ $t('bongo-cat:hat_unlocked', { name: hatRollResult.name }) }}
                    </span>
                    <span v-else>
                        {{ $t('bongo-cat:hat_duplicate', { name: hatRollResult.name }) }}
                    </span>
                </div>
            </div>
        </div>

        <div class="kiwi-appsettings-block">
            <h3>{{ $t('bongo-cat:reset') }}</h3>
            <div class="kiwi-appsettings-section">
                <p class="kiwi-bongo-settings__hint">
                    {{ $t('bongo-cat:reset_hint') }}
                </p>
                <div class="kiwi-bongo-settings__center">
                    <button type="button" class="u-button u-button-warning" @click="reset">
                        {{ $t('bongo-cat:reset') }}
                    </button>
                </div>
            </div>
        </div>
    </div>
</template>

<style>
.kiwi-bongo-cat {
    position: fixed;
    right: 18px;
    bottom: 88px;
    z-index: 50;
    width: 132px;
    pointer-events: none;
    font-family: inherit;
    line-height: 1.3;
}

.kiwi-bongo-cat--large {
    width: 231px;
}

.kiwi-bongo-cat__button {
    display: block;
    width: 100%;
    padding: 0;
    border: 0;
    background: transparent;
    pointer-events: auto;
    cursor: pointer;
    filter: drop-shadow(0 8px 10px var(--brand-shadow, rgba(20, 18, 16, 0.18)));
    transition: transform 0.18s ease;
}

.kiwi-bongo-cat__button:hover {
    transform: translateY(-2px);
}

.kiwi-bongo-cat__button:focus-visible {
    outline: 2px solid var(--brand-primary, #e0a458);
    outline-offset: 3px;
    border-radius: 18px;
}

.kiwi-bongo-cat__svg {
    display: block;
    width: 100%;
    height: auto;
    overflow: visible;
}

.kiwi-bongo-cat__body {
    transform-box: view-box;
    transform-origin: 80px 130px;
    animation: kiwi-bongo-breathe 3.8s ease-in-out infinite;
}

.kiwi-bongo-cat__head {
    transform-box: view-box;
    transform-origin: 80px 80px;
}

.kiwi-bongo-cat__hand {
    transform-box: view-box;
    animation-timing-function: ease-in-out;
    animation-iteration-count: infinite;
}

.kiwi-bongo-cat__hand--left {

        mounted: function() {

        methods: {
            cooldownRemaining: function(lastAt, duration) {
                var remaining = (lastAt || 0) + duration - this.now;
                return remaining > 0 ? remaining : 0;
            },
            cooldownLabel: function(remaining) {
                return this.$t('bongo-cat:cooldown_minutes', {

            tick: function() {
                this.now = Date.now();
                this.applyDecay();
                this.applyMusicEffects();
                this.applyProgression();

                if (this.napping && this.now >= this.napUntil) {
                    this.napping = false;
                    this.napUntil = 0;
                    this.lastActivityAt = this.now;

                this.checkSleep();
                if (this.evil && !this.evilMode) {
                    this.endEvil();
                }
                this.ensureYawnScheduled();
                this.ensureSmileScheduled();
            },
            applyDecay: function() {
                var now = Date.now();
                if (store.hidden) {
                    resetCareClocks(now);
                    return;
                }

                var lastHunger = Math.min(timestampOr(store.lastHungerAt, now), now);
                var lastTiredness = Math.min(timestampOr(store.lastTirednessAt, now), now);
                var lastMood = Math.min(timestampOr(store.lastMoodAt, now), now);
                var hungerElapsed = Math.min(
                    Math.max(now - lastHunger, 0),
                    OFFLINE_DECAY_CAP_MS
                );
                var tirednessElapsed = Math.min(
                    Math.max(now - lastTiredness, 0),
                    OFFLINE_DECAY_CAP_MS
                );
                var moodElapsed = Math.min(
                    Math.max(now - lastMood, 0),
                    OFFLINE_DECAY_CAP_MS
                );
                var hungerGain = Math.floor(hungerElapsed / HUNGER_DECAY_MS);
                var tirednessGain = this.asleep
                    ? 0
                    : Math.floor(tirednessElapsed / TIREDNESS_DECAY_MS);
                var multiplier = this.moodDecayMultiplier;
                var moodLoss = Math.floor((moodElapsed * multiplier) / MOOD_DECAY_MS);

                if (this.asleep) {
                    store.lastTirednessAt = now;
                }

                if (hungerGain === 0 && tirednessGain === 0 && moodLoss === 0) {
                    return;
                }

                store.hunger = clamp(store.hunger + hungerGain, MIN_HUNGER, 100);
                if (!this.asleep) {
                    store.tiredness = clamp(
                        store.tiredness + tirednessGain,
                        MIN_TIREDNESS,
                        100
                    );
                    store.lastTirednessAt = now - (tirednessElapsed % TIREDNESS_DECAY_MS);
                }
                store.mood = clamp(store.mood - moodLoss, MIN_MOOD, 100);
                store.lastHungerAt = now - (hungerElapsed % HUNGER_DECAY_MS);
                store.lastMoodAt = now - Math.floor(
                    ((moodElapsed * multiplier) % MOOD_DECAY_MS) / multiplier
                );
                persist();
            },
            applyMusicEffects: function() {
                var now = Date.now();
                if (store.hidden || this.asleep || !this.radioPlaying) {
                    this.lastMusicAt = now;
                    return;
                }

                var last = Math.min(timestampOr(this.lastMusicAt, now), now);
                var elapsed = Math.min(Math.max(now - last, 0), MUSIC_EFFECT_CAP_MS);
                var points = Math.floor(elapsed / MUSIC_EFFECT_MS);

                if (points === 0) {
                    return;
                }

                store.mood = clamp(store.mood + points, MIN_MOOD, 100);
                store.tiredness = clamp(
                    store.tiredness + points,
                    MIN_TIREDNESS,
                    100
                );
                this.lastMusicAt = now - (elapsed % MUSIC_EFFECT_MS);
                persist();
            },
            applyProgression: function() {
                var now = Date.now();

                if (store.hidden) {
                    store.lastActiveXpAt = now;
                    return;
                }

                var changed = false;
                var today = dayKey(new Date(now));

                if (store.lastXpDay !== today) {
                    store.lastXpDay = today;
                    store.xp += DAILY_XP;
                    changed = true;
                }

                var last = Math.min(timestampOr(store.lastActiveXpAt, now), now);
                var elapsed = Math.min(Math.max(now - last, 0), ACTIVE_XP_CAP_MS);
                var points = Math.floor(elapsed / ACTIVE_XP_MS);

                if (points > 0) {
                    store.xp += points * ACTIVE_XP_POINTS;
                    store.lastActiveXpAt = now - (elapsed % ACTIVE_XP_MS);
                    changed = true;
                }

                if (changed) {
                    persist();
                }
            },
            showHeart: function(duration) {

            },

            worry: function(duration) {

            acknowledge: function() {

            shouldBlink: function() {

            shouldSmile: function() {

                    return false;

                if (this.shouldYawn()) {
                    return false;

            rescheduleLimbSwaps: function() {

            onMessage: function(event) {

                if (!message.is_new || message.ignore) {

                if (message.nick && this.network && message.nick === this.network.nick) {

                if (message.type !== 'privmsg' && message.type !== 'action') {
                    return;
                }

                var now = Date.now();
                if (message.isHighlight) {

            onUserNotice: function(event) {

                }

                this.lastNoticeReactionAt = now;
                this.celebrate(CELEBRATE_DURATION_MS);
                store.mood = clamp(store.mood + 1, MIN_MOOD, 100);
                persist();
            },
            onNetworkStateChanged: function(state) {
                if (store.hidden || !this.network) {
                    return;
                }

                var now = Date.now();
                if (state === 'disconnected') {
                    if (now - this.lastWorriedReactionAt < WORRIED_REACTION_MS) {
                        return;
                    }

                    this.lastWorriedReactionAt = now;
                    this.worry(WORRIED_DURATION_MS);
                    return;
                }

                if (state === 'connected') {
                    if (now - this.lastConnectReactionAt < CONNECT_REACTION_MS) {
                        return;
                    }

                    this.lastConnectReactionAt = now;
                    this.celebrate(1600);
                }
            },
            wake: function() {
                var now = Date.now();
                var wasAsleep = this.sleeping || this.napping;
                this.lastActivityAt = now;
                if (wasAsleep) {
                    store.lastTirednessAt = now;
                    persist();
                }
                this.sleeping = false;
                this.worried = false;
                if (this.napping) {
                    this.napping = false;
                    this.napUntil = 0;
                }
            },
            checkSleep: function() {
                if (store.hidden || this.asleep) {
                    return;
                }

                if (this.radioPlaying && this.tirednessBand !== 'exhausted') {
                    this.lastActivityAt = Date.now();
                    this.sleeping = false;
                    return;
                }

                if (Date.now() - this.lastActivityAt > this.sleepThreshold) {
                    this.sleeping = true;
                    store.lastTirednessAt = Date.now();
                    persist();
                    if (this.tirednessBand === 'exhausted') {
                        this.playSound('snore');
                    }
                }
            },
            onActivity: function() {
                if (store.hidden) {
                    return;
                }

                this.wake();
                this.pawSide = this.pawSide === 'left' ? 'right' : 'left';
                this.pawDownSide = this.pawSide;
                this.typing = true;

                window.clearTimeout(this.pawDownTimer);
                this.pawDownTimer = window.setTimeout(function() {
                    this.pawDownSide = '';
                }.bind(this), PAW_DOWN_MS);

                window.clearTimeout(this.typingTimer);
                this.typingTimer = window.setTimeout(function() {
                    this.typing = false;
                }.bind(this), 520);

                if (store.sound && Date.now() - this.lastSoundAt > TAP_THROTTLE_MS) {
                    this.lastSoundAt = Date.now();
                    this.highTone = !this.highTone;
                    playTone(this.highTone);
                }
            },
            toggleCard: function() {
                this.wake();
                this.now = Date.now();
                this.cardOpen = !this.cardOpen;
            },
            openSettings: function() {
                this.cardOpen = false;
                if (!AppSettings) {
                    return;
                }

                kiwi.state.$emit('active.component', AppSettings);
                window.setTimeout(function() {
                    kiwi.state.$emit('settings.tab.show', SETTINGS_TAB_NAME);
                }, 0);
            },
            pet: function() {
                this.wake();
                this.now = Date.now();
                this.showHeart(900);

                if (!this.lastPetSoundAt || this.now - this.lastPetSoundAt >= PET_SOUND_MS) {
                    this.lastPetSoundAt = this.now;
                    this.playSound('laugh');
                }

                if (this.cooldownRemaining(store.lastCareAt.pet, PET_COOLDOWN_MS) === 0) {
                    var moodGain = store.hunger >= 75 || store.tiredness >= 75 ? 3 : 6;
                    store.mood = clamp(store.mood + moodGain, MIN_MOOD, 100);
                    store.lastCareAt.pet = Date.now();
                    persist();
                }
            },
            normalizeSkinConfig: function(data) {
                return buildSkinConfig(
                    data,
                    skinState.id || store.skin || configuredSkins[0]
                );
            },
            applySkinConfig: function(data) {
                applySkinData(
                    data,
                    skinState.id || store.skin || configuredSkins[0]
                );
            },
            loadSkin: function() {
                return loadSkinById(store.skin);
            },
            normalizeHatConfig: function(data) {
                var list = data && Array.isArray(data.hats) ? data.hats : [];
                var seen = Object.create(null);
                var options = [];

                list.forEach(function(item) {
                    if (!item || typeof item !== 'object') {
                        return;
                    }
                    if (typeof item.id !== 'string' || !item.id || seen[item.id]) {
                        return;
                    }
                    if (typeof item.name !== 'string' || !item.name) {
                        return;
                    }
                    if (typeof item.file !== 'string' || !item.file) {
                        return;
                    }

                    seen[item.id] = true;
                    options.push({
                        id: item.id,
                        name: item.name,
                        file: HATS_DIR + item.file,
                    });
                });

                return options;
            },
            applyHatCatalog: function(options) {
                var map = Object.create(null);
                options.forEach(function(hat) {
                    map[hat.id] = hat;
                });
                hatCatalog.options = options;
                hatCatalog.map = map;

                var unlocked = store.hatsUnlocked.filter(function(id) {
                    return !!map[id];
                });
                var selected = map[store.selectedHat] &&
                    unlocked.indexOf(store.selectedHat) !== -1
                    ? store.selectedHat
                    : '';

                if (unlocked.length !== store.hatsUnlocked.length ||
                    selected !== store.selectedHat) {
                    store.hatsUnlocked = unlocked;
                    store.selectedHat = selected;
                    persist();
                }
            },
            loadHats: function() {
                if (!window.fetch) {
                    this.applyHatCatalog([]);
                    return;
                }

                window.fetch(HATS_CONFIG_PATH)
                    .then(function(response) {
                        if (!response.ok) {
                            throw new Error('HTTP ' + response.status);
                        }
                        return response.json();
                    })
                    .then(function(data) {
                        this.applyHatCatalog(this.normalizeHatConfig(data));
                    }.bind(this))
                    .catch(function(err) {
                        this.applyHatCatalog([]);
                        log.error('Unable to load Bongo Companion hats', err);
                    }.bind(this));
            },
            normalizeSnackConfig: function(data) {
                var list = data && Array.isArray(data.snacks) ? data.snacks : [];
                var seen = Object.create(null);
                var options = [];

                list.forEach(function(item) {
                    if (!item || typeof item !== 'object') {
                        return;
                    }
                    if (typeof item.id !== 'string' || !item.id || seen[item.id]) {
                        return;
                    }
                    if (typeof item.name !== 'string' || !item.name) {
                        return;
                    }
                    if (typeof item.image !== 'string' || !item.image) {
                        return;
                    }
                    if (item.type !== 'food' && item.type !== 'drink') {
                        return;
                    }
                    if (item.render !== 'overlay' && item.render !== 'rain') {
                        return;
                    }

                    var bitten = typeof item.bitten === 'string' && item.bitten
                        ? SNACKS_DIR + item.bitten
                        : '';
                    seen[item.id] = true;
                    options.push({
                        id: item.id,
                        name: item.name,
                        type: item.type,
                        render: item.render,
                        image: SNACKS_DIR + item.image,
                        bittenImage: bitten,
                    });
                });

                return options;
            },
            loadSnacks: function() {
                if (!window.fetch) {
                    return;
                }

                window.fetch(SNACKS_CONFIG_PATH)
                    .then(function(response) {
                        if (!response.ok) {
                            throw new Error('HTTP ' + response.status);
                        }
                        return response.json();
                    })
                    .then(function(data) {
                        this.snackOptions = this.normalizeSnackConfig(data);
                    }.bind(this))
                    .catch(function(err) {
                        this.snackOptions = [];
                        log.error('Unable to load Bongo Companion snacks', err);
                    }.bind(this));
            },
            pickSnack: function() {
                if (!this.snackOptions.length) {
                    return null;
                }
                return this.snackOptions[
                    Math.floor(Math.random() * this.snackOptions.length)
                ];
            },
            snack: function() {
                if (this.snackRemaining > 0 || store.hunger < 10) {
                    return;
                }

                this.wake();
                this.now = Date.now();

                var snack = this.pickSnack();
                var food = snack ? snack.type !== 'drink' : true;
                store.hunger = clamp(
                    store.hunger - (food ? 30 : 20),
                    MIN_HUNGER,
                    100
                );
                store.tiredness = clamp(
                    store.tiredness + (food ? 2 : -5),
                    MIN_TIREDNESS,
                    100
                );
                store.mood = clamp(store.mood + (food ? 4 : 2), MIN_MOOD, 100);
                store.lastCareAt.snack = this.now;

                this.feeding = snack;
                this.feedingBitten = false;
                this.playSound(food ? 'eat' : 'drink');
                window.clearTimeout(this.feedingTimer);
                window.clearTimeout(this.feedingSwapTimer);

                if (snack) {
                    if (snack.render === 'rain') {
                        this.feedingTimer = window.setTimeout(function() {
                            this.feeding = null;
                        }.bind(this), FOOD_RAIN_MS);
                    } else {
                        if (snack.bittenImage) {
                            this.feedingSwapTimer = window.setTimeout(function() {
                                this.feedingBitten = true;
                            }.bind(this), DRINK_MS / 2);
                        }
                        this.feedingTimer = window.setTimeout(function() {
                            this.feeding = null;
                            this.feedingBitten = false;
                        }.bind(this), DRINK_MS);
                    }
                }

                persist();
            },
            nap: function() {
                if (this.napRemaining > 0 || store.tiredness < 10) {
                    return;
                }

                this.lastActivityAt = Date.now();
                this.sleeping = false;
                this.napping = true;
                this.napUntil = this.lastActivityAt + NAP_DURATION_MS;
                this.now = this.lastActivityAt;
                var rest = store.hunger >= 75 ? 20 : 35;
                store.tiredness = clamp(store.tiredness - rest, MIN_TIREDNESS, 100);
                store.lastTirednessAt = this.now;
                store.mood = clamp(store.mood + 8, MIN_MOOD, 100);
                store.lastCareAt.nap = this.now;
                this.playSound('snore');
                persist();
            },
            playSound: function(name) {
                playSample(name);
            },
            toggleSound: function() {
                store.sound = !store.sound;
                persist();
                if (store.sound) {
                    playTone(true);
                }
            },
        },
    });

    var SettingsPanel = kiwi.Vue.extend({
        template: '#kiwi-bongo-cat-settings',
        data: function() {
            return {
                draftName: store.name,
                hatRollResult: null,
                hatRollTimer: null,
            };
        },
        computed: {
            store: function() {
                return store;
            },
            skinOptions: function() {
                return configuredSkins;
            },
            skinError: function() {
                return skinState.failedSkin;
            },
            level: function() {
                return Math.floor(store.xp / XP_PER_LEVEL) + 1;
            },
            levelProgress: function() {
                return store.xp % XP_PER_LEVEL;
            },
            xpPerLevel: function() {
                return XP_PER_LEVEL;
            },
            hatOptions: function() {
                return hatCatalog.options.filter(function(hat) {
                    return store.hatsUnlocked.indexOf(hat.id) !== -1;
                });
            },
            hatRollsRemaining: function() {
                return Math.max(0, this.level - store.hatRollsUsed);
            },
            hatsUnlockedCount: function() {
                return store.hatsUnlocked.length;
            },
            hatCount: function() {
                return hatCatalog.options.length;
            },
        },
        watch: {
            'store.name': function(name) {
                this.draftName = name;
            },
        },
        beforeDestroy: function() {
            window.clearTimeout(this.hatRollTimer);
        },
        methods: {
            saveName: function() {
                var name = (this.draftName || '').trim().slice(0, 20);
                if (!name) {
                    name = DEFAULT_NAME;
                }

                store.name = name;
                this.draftName = name;
                persist();
            },
            toggleSound: function() {
                store.sound = !store.sound;
                persist();
                if (store.sound) {
                    playTone(true);
                }
            },
            saveVolume: function() {
                store.volume = clamp(numberOr(store.volume, DEFAULT_VOLUME), 0, 1);
                persist();
                playTone(true);
            },
            toggleCalm: function() {
                store.calm = !store.calm;
                persist();
            },
            toggleLarge: function() {
                store.large = !store.large;
                persist();
            },
            show: function() {
                resetCareClocks(Date.now());
                store.hidden = false;
                persist();
            },
            hide: function() {
                resetCareClocks(Date.now());
                store.hidden = true;
                persist();
            },
            selectSkin: function(value) {
                if (configuredSkins.indexOf(value) === -1) {
                    return;
                }
                store.skin = value;
                persist();
                return loadSkinById(value);
            },
            selectHat: function(value) {
                if (value !== '' && store.hatsUnlocked.indexOf(value) === -1) {
                    return;
                }
                store.selectedHat = value;
                persist();
            },
            rollHat: function() {
                if (this.hatRollsRemaining <= 0 || !hatCatalog.options.length) {
                    return;
                }

                var hat = hatCatalog.options[
                    Math.floor(Math.random() * hatCatalog.options.length)
                ];
                var isNew = store.hatsUnlocked.indexOf(hat.id) === -1;
                store.hatRollsUsed += 1;

                if (isNew) {
                    store.hatsUnlocked.push(hat.id);
                    if (!store.selectedHat) {
                        store.selectedHat = hat.id;
                    }
                    this.hatRollResult = {
                        type: 'new',
                        name: hat.name,
                        file: hat.file,
                    };
                } else {
                    store.xp += 5;
                    this.hatRollResult = {
                        type: 'duplicate',
                        name: hat.name,
                        file: hat.file,
                    };
                }

                persist();
                window.clearTimeout(this.hatRollTimer);
                this.hatRollTimer = window.setTimeout(function() {
                    this.hatRollResult = null;
                }.bind(this), 4000);
            },
            reset: function() {
                if (!window.confirm(this.$t('bongo-cat:reset_confirm'))) {
                    return;
                }

                var now = Date.now();
                store.hunger = DEFAULT_HUNGER;
                store.tiredness = DEFAULT_TIREDNESS;
                store.mood = DEFAULT_MOOD;
                store.xp = 0;
                store.lastHungerAt = now;
                store.lastTirednessAt = now;
                store.lastMoodAt = now;
                store.lastActiveXpAt = now;
                store.lastXpDay = dayKey(new Date(now));
                store.hatsUnlocked = [];
                store.selectedHat = '';
                store.hatRollsUsed = 0;
                store.lastCareAt.snack = 0;
                store.lastCareAt.nap = 0;
                store.lastCareAt.pet = 0;
                this.draftName = store.name;
                persist();
            },
        },
    });

    kiwi.addUi('app', BongoCat);
    kiwi.addTab('settings', SETTINGS_TAB_NAME, SettingsPanel);
});
</script>
