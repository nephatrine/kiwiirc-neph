<template id="channels-sidebar-button">
    <div v-show="!listBlocked" :class="{ 'kiwi-header-option--active': isActive }">
        <a :title="$t('channels')" @click="buttonClicked">
            <i class="fa fa-list" aria-hidden="true"></i>
        </a>
    </div>
</template>

<script>
kiwi.plugin('channels-sidebar', function (kiwi, log) {
    var chanList = kiwi.require('components/ChannelList');

    var Button = kiwi.Vue.extend({
        template: '#channels-sidebar-button',
        props: ['sidebarState', 'network'],
        data: function data() {
            return {
                now: Date.now(),
                waitTimer: null,
            };
        },
        computed: {
            isActive: function isActive() {
                var sidebarState = this.sidebarState;
                if (sidebarState && typeof sidebarState.isComponentOpen === 'function') {
                    return sidebarState.isComponentOpen('channels-sidebar');
                }
                var active = sidebarState && sidebarState.activeComponent;
                return !!(active && (active === chanList || active.options === chanList));
            },
            listBlocked: function listBlocked() {
                var network = this.network;
                if (!network || !network.channelListConnectRemaining) {
                    return true;
                }
                return network.channelListConnectRemaining(this.now) > 0;
            },
        },
        watch: {
            network: {
                immediate: true,
                handler: function handler() {
                    this.scheduleListShow();
                },
            },
            'network.connected_at': {
                immediate: true,
                handler: function handler() {
                    this.scheduleListShow();
                },
            },
        },
        beforeDestroy: function beforeDestroy() {
            clearTimeout(this.waitTimer);
        },
        methods: {
            scheduleListShow: function scheduleListShow() {
                var self = this;
                clearTimeout(this.waitTimer);
                this.waitTimer = null;
                this.now = Date.now();
                var network = this.network;
                if (!network || !network.connected_at || !network.channelListConnectRemaining) {
                    return;
                }
                var remaining = network.channelListConnectRemaining(this.now);
                if (remaining > 0) {
                    this.waitTimer = setTimeout(function () {
                        self.scheduleListShow();
                    }, remaining);
                }
            },
            buttonClicked: function buttonClicked() {
                if (this.isActive) {
                    this.sidebarState.close();
                    return;
                }
                var network = this.network || this.$state.getActiveNetwork();
                if (!network) {
                    return;
                }
                network.maybeUpdateChannelList();
                if (typeof kiwi.toggleInSidebar === 'function') {
                    kiwi.toggleInSidebar('channels-sidebar', chanList, { network: network });
                } else {
                    kiwi.showInSidebar(chanList, { network: network });
                }
            },
        },
    });

    kiwi.addUi('header_channel', Button);
});
</script>
