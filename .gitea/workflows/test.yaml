name: Test Package
run-name: ${{ gitea.actor }} pushed to ${{ gitea.repository }}:${{ gitea.ref_name }}
on:
    push:
        branches:
            - "master"
    pull_request:
    workflow_dispatch:
permissions:
    contents: read
jobs:
    test:
        runs-on: nephnet-fast
        timeout-minutes: 30
        concurrency:
            group: test-${{ gitea.repository }}-${{ gitea.ref }}
            cancel-in-progress: true
        container:
            image: code.nephatrine.net/nephnet/nxb-alpine:latest
        steps:
            - name: Checkout Repository
              uses: https://code.nephatrine.net/NephHub/checkout@v6
            - name: Run Tests
              run: cd "${{ gitea.workspace }}" && npm ci && npm run lint && npm test && npm run build
            - name: Notify Discord
              uses: https://code.nephatrine.net/NephHub/actions-status-discord@v1
              if: failure()
              with:
                  title: "FAIL: test"
                  webhook: ${{ secrets.DISCORD_WH_PROJECTS }}
