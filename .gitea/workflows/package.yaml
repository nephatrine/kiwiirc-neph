name: Package Debian
run-name: Package Debian - ${{ gitea.ref_name }} (#${{ gitea.run_number }})
on:
    workflow_dispatch:
permissions:
    contents: read
    actions: write
jobs:
    package_deb:
        runs-on: nephnet-fast
        timeout-minutes: 60
        concurrency:
            group: package-${{ gitea.repository }}-${{ gitea.ref }}
            cancel-in-progress: false
        container:
            image: node:22-trixie
        env:
            CSC_IDENTITY_AUTO_DISCOVERY: "false"
            ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
            PACKAGE_OWNER: ${{ gitea.repository_owner }}
            PACKAGER_USER: ${{ gitea.actor }}
            GITEA_URL: https://code.nephatrine.net
            DISTRIBUTION: stable
            COMPONENT: main
        steps:
            - name: Checkout Repository
              uses: https://code.nephatrine.net/NephHub/checkout@v6
              with:
                  fetch-depth: 0
            - name: Install Debian Build Dependencies
              run: bash "${{ gitea.workspace }}/desktop/docker/install-deb-deps.sh"
            - name: Build Debian Packages
              run: bash "${{ gitea.workspace }}/scripts/build-deb-packages.sh"
            - name: Upload Debian Packages
              uses: https://code.nephatrine.net/NephHub/gitea-upload-artifact@v4
              with:
                  name: kiwiirc-deb-packages
                  path: release-packages/*.deb
                  if-no-files-found: error
                  retention-days: 7
            - name: Publish Debian Packages
              env:
                  PACKAGER_TOKEN: ${{ secrets.PACKAGER_TOKEN }}
              run: bash "${{ gitea.workspace }}/scripts/publish-debian-packages.sh"
            - name: Notify Discord
              uses: https://code.nephatrine.net/NephHub/actions-status-discord@v1
              if: failure()
              with:
                  title: "FAIL: package"
                  webhook: ${{ secrets.DISCORD_WH_PROJECTS }}
