name: Desktop Build
run-name: Desktop Build - ${{ gitea.ref_name }} (#${{ gitea.run_number }})
on:
    workflow_dispatch:
permissions:
    contents: read
    actions: write
jobs:
    build_desktop:
        runs-on: nephnet-fast
        timeout-minutes: 120
        container:
            image: node:22-trixie
        env:
            CSC_IDENTITY_AUTO_DISCOVERY: "false"
            ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
            WINEDEBUG: "-all"
            WINEDLLOVERRIDES: "winemenubuilder.exe=d;mscoree=d;mshtml=d"
        steps:
            - name: Checkout Repository
              uses: https://code.nephatrine.net/NephHub/checkout@v6
            - name: Install Build Dependencies
              run: bash "${{ gitea.workspace }}/desktop/docker/install-deps.sh"
            - name: Build Release Assets
              run: cd "${{ gitea.workspace }}" && bash scripts/release-build.sh
            - name: Upload Build Artifacts
              uses: https://code.nephatrine.net/NephHub/gitea-upload-artifact@v4
              with:
                  name: kiwiirc-desktop-artifacts
                  path: release-assets/
                  if-no-files-found: error
                  compression-level: 0
            - name: Notify Discord
              uses: https://code.nephatrine.net/NephHub/actions-status-discord@v1
              if: failure()
              with:
                  title: "FAIL: desktop build"
                  webhook: ${{ secrets.DISCORD_WH_PROJECTS }}
