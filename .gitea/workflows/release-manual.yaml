name: Release Package (Manual)
run-name: Manual Release of ${{ inputs.tag }}
on:
    workflow_dispatch:
        inputs:
            tag:
                description: Release Tag
                required: true
permissions:
    contents: read
    releases: write
jobs:
    build_release:
        runs-on: nephnet-fast
        timeout-minutes: 120
        container:
            image: node:22-trixie
        env:
            CSC_IDENTITY_AUTO_DISCOVERY: "false"
            ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
            WINEDEBUG: "-all"
            WINEDLLOVERRIDES: "winemenubuilder.exe=d;mscoree=d;mshtml=d"
        steps:
            - name: Checkout Repository
              uses: https://code.nephatrine.net/NephHub/checkout@v6
              with:
                  ref: ${{ inputs.tag }}
            - name: Install Build Dependencies
              run: bash "${{ gitea.workspace }}/desktop/docker/install-deps.sh"
            - name: Build Release Assets
              env:
                  RELEASE_TAG: ${{ inputs.tag }}
              run: cd "${{ gitea.workspace }}" && bash scripts/release-build.sh
            - name: Create Release
              uses: https://code.nephatrine.net/NephHub/gitea-release-action@v1
              with:
                  tag_name: ${{ inputs.tag }}
                  files: |
                      release-assets/*
            - name: Notify Discord
              uses: https://code.nephatrine.net/NephHub/actions-status-discord@v1
              if: failure()
              with:
                  title: "FAIL: release-manual"
                  webhook: ${{ secrets.DISCORD_WH_PROJECTS }}
